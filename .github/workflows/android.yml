# The Android keyboard reads its models and prompts from Setups.swift at build time, so a change to
# the Mac app's setups or prompts is tested here too (docs/android-keyboard.md).
name: Android keyboard

on:
  push:
    branches: [main]
    paths:
      - android/**
      - Sources/DictationKit/Setups.swift
      - bench/polish_prompts/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - Sources/DictationKit/Setups.swift
      - bench/polish_prompts/**
      - .github/workflows/android.yml

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit and UI tests
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Build the APK
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: dictation-keyboard
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/screenshots/
            android/app/build/reports/tests/
